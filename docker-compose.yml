services:
  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  # БД для event-manager
  postgres-manager:
    image: postgres:15
    container_name: postgres-manager
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zhopa
      POSTGRES_DB: event-manager-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_manager_data:/var/lib/postgresql/data

  # БД для event-notificator
  postgres-notificator:
    image: postgres:15
    container_name: postgres-notificator
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zhopa
      POSTGRES_DB: event-notificator-db
    ports:
      - "5433:5432"
    volumes:
      - postgres_notificator_data:/var/lib/postgresql/data

volumes:
  postgres_manager_data:
  postgres_notificator_data:
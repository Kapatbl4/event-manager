spring.application.name=event-manager

spring.datasource.url=jdbc:postgresql://localhost:5432/event-manager-db
spring.datasource.username=postgres
spring.datasource.password=zhopa
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.jackson.deserialization.fail-on-unknown-properties=true

kafka.topic.event-changes=event-topic
kafka.topic.dlq=event-topic-dlq

app.outbox.cleanup.cron=0 0 12 * * TUE
app.outbox.cleanup.retention-days=14
app.outbox.limit-first-unsent-messages=10
app.outbox.kafka.sending-interval=5000

#springdoc.swagger-ui.url: /openapi.yaml

logging.level.root=INFO

logging.level.org.springframework.security=DEBUG

spring.output.ansi.enabled=ALWAYS

jwt.lifetime = 86400000

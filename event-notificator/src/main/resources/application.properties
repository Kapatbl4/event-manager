spring.application.name=event-notificator

spring.datasource.url=jdbc:postgresql://localhost:5433/event-notificator-db
spring.datasource.username=postgres
spring.datasource.password=zhopa
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notificator-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

kafka.topic.event-changes=event-topic

server.port=8081

logging.level.root=INFO

spring.output.ansi.enabled=ALWAYS
